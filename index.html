<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой дисторшн-синтезатор | iTunes Preview + Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b0ffb0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: #111118;
            border: 2px solid #2a2a3a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 60px rgba(0, 255, 100, 0.08), 0 0 120px rgba(0, 150, 255, 0.05);
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 18px;
            background: linear-gradient(45deg, #00ff6622, #0066ff22, #ff006622, #00ff6622);
            background-size: 400% 400%;
            z-index: -1;
            animation: borderGlow 8s ease infinite;
            pointer-events: none;
        }
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff6644, 0 0 40px #00ff6644;
        }
        .subtitle {
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #668888;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .search-section {
            position: relative;
            margin-bottom: 20px;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .search-row input {
            flex: 1;
            background: #0d0d15;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 14px 18px;
            color: #b0ffb0;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .search-row input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 20px #00ff6633;
        }
        .search-row input::placeholder {
            color: #445566;
        }
        .search-row button {
            background: #0d0d15;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 14px 25px;
            color: #00ff88;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .search-row button:hover {
            border-color: #00ff66;
            box-shadow: 0 0 25px #00ff6644;
            background: #0f1a12;
        }
        .results-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #151520;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            max-height: 420px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px #00ff6611;
            margin-top: 4px;
        }
        .results-dropdown.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a2a;
            transition: all 0.2s;
        }
        .result-item:hover {
            background: #1a1a2e;
            box-shadow: inset 3px 0 0 #00ff66;
        }
        .result-item img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #2a2a3a;
            background: #0d0d15;
        }
        .result-item .info {
            flex: 1;
            min-width: 0;
        }
        .result-item .track-name {
            font-size: 0.9rem;
            color: #d0ffd0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }
        .result-item .artist-name {
            font-size: 0.75rem;
            color: #668888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-item .duration {
            font-size: 0.7rem;
            color: #445566;
            white-space: nowrap;
        }
        .results-dropdown::-webkit-scrollbar { width: 6px; }
        .results-dropdown::-webkit-scrollbar-track { background: #0d0d15; }
        .results-dropdown::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
        .results-dropdown::-webkit-scrollbar-thumb:hover { background: #00ff6655; }
        .loading-indicator {
            display: none;
            padding: 25px;
            text-align: center;
            color: #668888;
            font-size: 0.85rem;
            letter-spacing: 2px;
            animation: pulse 1.5s ease infinite;
        }
        .loading-indicator.active { display: block; }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .no-results {
            display: none;
            padding: 25px;
            text-align: center;
            color: #664444;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
        .no-results.active { display: block; }
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #0d0d15;
            border-radius: 10px;
            border: 1px solid #1a1a2a;
            min-height: 75px;
        }
        .now-playing img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #2a2a3a;
            background: #0d0d15;
        }
        .now-playing .np-info { flex: 1; min-width: 0; }
        .now-playing .np-track {
            font-size: 1rem;
            color: #e0ffe0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }
        .now-playing .np-artist {
            font-size: 0.8rem;
            color: #668888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-playing .np-status {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #00ff88;
            text-transform: uppercase;
            animation: pulse 1.2s ease infinite;
        }
        .visualizer-container {
            position: relative;
            background: #0d0d15;
            border-radius: 10px;
            border: 1px solid #1a1a2a;
            overflow: hidden;
            height: 120px;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }
        .visualizer-overlay {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: #445566;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 8px #000;
        }
        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #0d0d15;
            border: 1px solid #1a1a2a;
            border-radius: 10px;
            padding: 20px;
        }
        .knob-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 0 150px;
            min-width: 120px;
        }
        .knob-group label {
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: #668888;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }
        .knob-group input[type="range"] {
            width: 100%;
            accent-color: #00ff66;
            background: #1a1a2a;
            height: 4px;
            border-radius: 2px;
            cursor: pointer;
        }
        .knob-group select {
            background: #1a1a2a;
            color: #b0ffb0;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            padding: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
        }
        .mixer-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mixer-buttons button {
            background: transparent;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            padding: 8px 12px;
            color: #b0ffb0;
            font-size: 0.6rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .mixer-buttons button:hover {
            border-color: #ff0066;
            color: #ff6688;
            box-shadow: 0 0 15px #ff006633;
        }
        .mixer-buttons button.active-mute {
            background: #2a0a0a;
            border-color: #ff0066;
            color: #ff6688;
        }
        .playback-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .playback-controls button {
            background: #0d0d15;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px 20px;
            color: #b0ffb0;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            min-width: 100px;
        }
        .playback-controls button:hover {
            border-color: #00ff66;
            box-shadow: 0 0 20px #00ff6633;
        }
        .playback-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #2a2a3a;
            box-shadow: none;
        }
        .playback-controls button.active-btn {
            background: #0f1a12;
            border-color: #00ff66;
            box-shadow: 0 0 25px #00ff6644;
            color: #00ff88;
        }
        .status-text {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #445566;
            margin-top: 8px;
            min-height: 20px;
            text-transform: uppercase;
        }
        @media (max-width: 700px) {
            .container { padding: 15px; }
            .knob-group { flex: 1 0 100px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬡ ЦИФРОВОЙ ДИСТОРШН</h1>
        <div class="subtitle">Прорывной цифровой шум · iTunes Preview + Loop</div>

        <!-- Поиск -->
        <div class="search-section">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Поиск трека в iTunes..." autocomplete="off">
                <button id="searchBtn">НАЙТИ</button>
            </div>
            <div class="results-dropdown" id="resultsDropdown">
                <div class="loading-indicator" id="loadingIndicator">⏣ СКАНИРОВАНИЕ БАЗЫ...</div>
                <div class="no-results" id="noResults">⚠ НИЧЕГО НЕ НАЙДЕНО</div>
                <div id="resultsList"></div>
            </div>
        </div>

        <!-- Плеер -->
        <div class="player-section">
            <div class="now-playing" id="nowPlaying">
                <img id="npCover" src="" alt="" style="display:none;">
                <div class="np-info">
                    <div class="np-track" id="npTrack">Нет трека</div>
                    <div class="np-artist" id="npArtist">Выберите трек из поиска</div>
                    <div class="np-status" id="npStatus">ОЖИДАНИЕ</div>
                </div>
            </div>

            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
                <div class="visualizer-overlay">СПЕКТР · ЦИФРОВОЙ ДИСТОРШН</div>
            </div>

            <!-- Панель регулировок -->
            <div class="controls-panel">
                <div class="knob-group">
                    <label>ПОРОГ БИТА <span id="thresholdVal">0.2</span></label>
                    <input type="range" id="threshold" min="0.01" max="0.9" step="0.01" value="0.2">
                </div>
                <div class="knob-group">
                    <label>ДЛИТЕЛЬНОСТЬ <span id="durationVal">0.15</span>с</label>
                    <input type="range" id="burstDuration" min="0.02" max="0.6" step="0.01" value="0.15">
                </div>
                <div class="knob-group">
                    <label>АТАКА <span id="attackVal">0.001</span>с</label>
                    <input type="range" id="attackTime" min="0.001" max="0.1" step="0.001" value="0.001">
                </div>
                <div class="knob-group">
                    <label>РЕЛИЗ <span id="releaseVal">0.05</span>с</label>
                    <input type="range" id="releaseTime" min="0.01" max="0.3" step="0.01" value="0.05">
                </div>
                <div class="knob-group">
                    <label>ДИСТОРШН (CLIP) <span id="distVal">80</span></label>
                    <input type="range" id="distortionAmount" min="0" max="250" step="1" value="80">
                </div>
                <div class="knob-group">
                    <label>БИТКРАШ (BIT) <span id="bitcrusherVal">5</span></label>
                    <input type="range" id="bitcrusherBits" min="1" max="16" step="1" value="5">
                </div>
                <div class="knob-group">
                    <label>ДАУНСЕМПЛ (SR) <span id="downsampleVal">6000</span>Гц</label>
                    <input type="range" id="downsampleRate" min="1000" max="22050" step="100" value="6000">
                </div>
                <div class="knob-group">
                    <label>РЕВЕРБ <span id="reverbVal">0.4</span></label>
                    <input type="range" id="reverbLevel" min="0" max="1" step="0.01" value="0.4">
                </div>
                <div class="knob-group">
                    <label>ЧАСТОТА ФИЛЬТРА <span id="cutoffVal">1800</span>Гц</label>
                    <input type="range" id="cutoffFreq" min="200" max="8000" step="10" value="1800">
                </div>
                <div class="knob-group">
                    <label>РЕЗОНАНС <span id="resVal">4</span></label>
                    <input type="range" id="resonance" min="0.1" max="25" step="0.1" value="4">
                </div>
                <div class="knob-group">
                    <label>МИН. ИНТЕРВАЛ <span id="intervalVal">100</span>мс</label>
                    <input type="range" id="minInterval" min="20" max="400" step="5" value="100">
                </div>
                <div class="knob-group">
                    <label>ТИП РИТМА</label>
                    <select id="rhythmMode">
                        <option value="every">Каждый бит</option>
                        <option value="half">Каждый второй</option>
                        <option value="quarter">Каждый четвёртый</option>
                        <option value="random">Случайно</option>
                    </select>
                </div>
                <div class="knob-group">
                    <label>ГРОМКОСТЬ МУЗЫКИ</label>
                    <input type="range" id="musicVolume" min="0" max="100" value="20">
                </div>
                <div class="knob-group">
                    <label>ГРОМКОСТЬ ШУМА</label>
                    <input type="range" id="noiseVolume" min="0" max="100" value="85">
                </div>
                <div class="mixer-buttons">
                    <button id="muteMusicBtn">🔇 МУЗЫКА</button>
                    <button id="muteNoiseBtn">🔇 ШУМ</button>
                    <button id="loopBtn" class="active-btn">🔁 LOOP: ВКЛ</button>
                </div>
            </div>

            <div class="playback-controls">
                <button id="playBtn" disabled>▶ ЗАПУСК</button>
                <button id="stopBtn" disabled>■ СТОП</button>
                <button id="glitchBtn" disabled>⚡ ГЛИТЧ</button>
                <button id="noiseTypeBtn" disabled>ТИП: ДИСТОРШН</button>
            </div>
            <div class="status-text" id="statusText">СИСТЕМА ГОТОВА · ВВЕДИТЕ ЗАПРОС</div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== СОСТОЯНИЕ ====================
            const state = {
                audioContext: null,
                musicAnalyser: null,
                outputAnalyser: null,
                sourceNode: null,
                musicGain: null,
                noiseGain: null,
                masterGain: null,
                noiseEngine: null,
                isPlaying: false,
                currentTrack: null,
                noiseType: 0,
                noiseTypeNames: ['ДИСТОРШН', 'РЕЗОНАНС', 'БИТКРАШ', 'ХАОС'],
                dominantFreq: 0,
                frequencyHistory: [],
                glitchIntensity: 0,
                isGlitching: false,
                musicMuted: false,
                noiseMuted: false,
                lastBeatTime: 0,
                rhythmCounter: 0,
                loopEnabled: true,
                previousSpectrum: null,
                spectralFluxHistory: [],
            };

            // DOM элементы
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultsDropdown = document.getElementById('resultsDropdown');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const noResults = document.getElementById('noResults');
            const resultsList = document.getElementById('resultsList');
            const npCover = document.getElementById('npCover');
            const npTrack = document.getElementById('npTrack');
            const npArtist = document.getElementById('npArtist');
            const npStatus = document.getElementById('npStatus');
            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const glitchBtn = document.getElementById('glitchBtn');
            const noiseTypeBtn = document.getElementById('noiseTypeBtn');
            const statusText = document.getElementById('statusText');
            const visualizer = document.getElementById('visualizer');
            const ctx = visualizer.getContext('2d');

            // Регуляторы
            const thresholdSlider = document.getElementById('threshold');
            const durationSlider = document.getElementById('burstDuration');
            const attackSlider = document.getElementById('attackTime');
            const releaseSlider = document.getElementById('releaseTime');
            const distortionSlider = document.getElementById('distortionAmount');
            const bitcrusherSlider = document.getElementById('bitcrusherBits');
            const downsampleSlider = document.getElementById('downsampleRate');
            const reverbSlider = document.getElementById('reverbLevel');
            const cutoffSlider = document.getElementById('cutoffFreq');
            const resonanceSlider = document.getElementById('resonance');
            const intervalSlider = document.getElementById('minInterval');
            const rhythmModeSelect = document.getElementById('rhythmMode');
            const musicVolumeSlider = document.getElementById('musicVolume');
            const noiseVolumeSlider = document.getElementById('noiseVolume');
            const muteMusicBtn = document.getElementById('muteMusicBtn');
            const muteNoiseBtn = document.getElementById('muteNoiseBtn');
            const loopBtn = document.getElementById('loopBtn');

            // Функция обновления отображаемых значений
            function updateDisplay() {
                document.getElementById('thresholdVal').textContent = thresholdSlider.value;
                document.getElementById('durationVal').textContent = durationSlider.value;
                document.getElementById('attackVal').textContent = attackSlider.value;
                document.getElementById('releaseVal').textContent = releaseSlider.value;
                document.getElementById('distVal').textContent = distortionSlider.value;
                document.getElementById('bitcrusherVal').textContent = bitcrusherSlider.value;
                document.getElementById('downsampleVal').textContent = downsampleSlider.value;
                document.getElementById('reverbVal').textContent = reverbSlider.value;
                document.getElementById('cutoffVal').textContent = cutoffSlider.value;
                document.getElementById('resVal').textContent = resonanceSlider.value;
                document.getElementById('intervalVal').textContent = intervalSlider.value;
            }
            updateDisplay();
            [thresholdSlider, durationSlider, attackSlider, releaseSlider, distortionSlider, bitcrusherSlider, downsampleSlider, reverbSlider, cutoffSlider, resonanceSlider, intervalSlider].forEach(slider => {
                slider.addEventListener('input', updateDisplay);
            });

            // ==================== ВИЗУАЛИЗАЦИЯ ====================
            let animationId = null;
            function resizeVisualizer() {
                const rect = visualizer.parentElement.getBoundingClientRect();
                visualizer.width = rect.width;
                visualizer.height = rect.height;
            }
            resizeVisualizer();
            window.addEventListener('resize', resizeVisualizer);

            function drawVisualizer() {
                const w = visualizer.width;
                const h = visualizer.height;
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, w, h);
                const analyser = state.outputAnalyser;
                if (analyser && state.isPlaying) {
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    analyser.getByteFrequencyData(dataArray);
                    const usableBars = Math.min(bufferLength, 160);
                    const step = Math.floor(bufferLength / usableBars);
                    for (let i = 0; i < usableBars; i++) {
                        const dataIndex = i * step;
                        const value = dataArray[dataIndex] || 0;
                        const barHeight = (value / 255) * h * 0.9;
                        const x = i * (w / usableBars);
                        const hue = (i / usableBars) * 160 + 80;
                        const saturation = 80 + (value / 255) * 20;
                        const lightness = 20 + (value / 255) * 50;
                        ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                        ctx.fillRect(x, h - barHeight, w / usableBars - 1, barHeight);
                        if (value > 180) {
                            ctx.fillStyle = 'rgba(255,0,100,0.3)';
                            ctx.fillRect(x, h - barHeight, w / usableBars - 1, barHeight);
                        }
                    }
                    if (state.dominantFreq > 0) {
                        const freqX = (state.dominantFreq / 6000) * w;
                        ctx.strokeStyle = '#ff0066';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(freqX, 0);
                        ctx.lineTo(freqX, h);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        const noteName = freqToNoteName(state.dominantFreq);
                        ctx.fillStyle = '#ff4488';
                        ctx.font = '10px Courier New';
                        ctx.fillText(`${noteName} (${Math.round(state.dominantFreq)}Hz)`, freqX + 5, 15);
                        ctx.fillText(`ГЛИТЧ: ${Math.round(state.glitchIntensity * 100)}%`, 10, h - 10);
                    }
                    for (let i = 0; i < 30; i++) {
                        const x = Math.random() * w;
                        const y = Math.random() * h;
                        ctx.fillStyle = `rgba(255,0,100,${Math.random() * 0.2 + 0.05})`;
                        ctx.fillRect(x, y, Math.random() * 3 + 1, Math.random() * 3 + 1);
                    }
                } else {
                    for (let i = 0; i < 80; i++) {
                        const x = Math.random() * w;
                        const y = Math.random() * h;
                        ctx.fillStyle = `rgba(255,80,120,${Math.random() * 0.06 + 0.01})`;
                        ctx.fillRect(x, y, 2, 2);
                    }
                    ctx.fillStyle = '#1a2a1a';
                    ctx.font = '16px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('⊘ НЕТ СИГНАЛА', w / 2, h / 2 + 5);
                    ctx.textAlign = 'left';
                }
            }
            function startVisualizerLoop() {
                if (animationId) return;
                function animate() {
                    drawVisualizer();
                    animationId = requestAnimationFrame(animate);
                }
                animate();
            }
            startVisualizerLoop();

            // ==================== УТИЛИТЫ ====================
            function freqToNoteName(freq) {
                if (freq <= 0) return '--';
                const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const A4 = 440;
                const A4Index = 69;
                const semitonesFromA4 = 12 * Math.log2(freq / A4);
                const midiNote = Math.round(A4Index + semitonesFromA4);
                const noteIndex = ((midiNote % 12) + 12) % 12;
                const octave = Math.floor(midiNote / 12) - 1;
                return `${noteNames[noteIndex]}${octave}`;
            }
            function setStatus(text) {
                statusText.textContent = text;
                npStatus.textContent = text;
            }
            function formatDuration(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                return `${min}:${sec.toString().padStart(2, '0')}`;
            }

            // ==================== ITUNES ПОИСК ====================
            let searchTimeout = null;
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch();
                if (e.key === 'Escape') closeResults();
            });
            searchInput.addEventListener('input', () => {
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    if (searchInput.value.trim().length >= 2) performSearch();
                    else closeResults();
                }, 500);
            });
            async function performSearch() {
                const query = searchInput.value.trim();
                if (query.length < 2) return;
                resultsDropdown.classList.add('active');
                loadingIndicator.classList.add('active');
                noResults.classList.remove('active');
                resultsList.innerHTML = '';
                try {
                    const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=20&country=RU`);
                    if (!response.ok) throw new Error('Network error');
                    const data = await response.json();
                    loadingIndicator.classList.remove('active');
                    if (data.results && data.results.length > 0) {
                        renderResults(data.results);
                    } else {
                        noResults.classList.add('active');
                    }
                } catch (error) {
                    loadingIndicator.classList.remove('active');
                    noResults.classList.add('active');
                    noResults.textContent = '⚠ ОШИБКА СЕТИ · ПОВТОРИТЕ';
                }
            }
            function renderResults(tracks) {
                resultsList.innerHTML = '';
                tracks.forEach((track) => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    const coverUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100', '200x200') : '';
                    const duration = track.trackTimeMillis ? formatDuration(track.trackTimeMillis) : '--:--';
                    item.innerHTML = `
                        <img src="${coverUrl}" alt="cover" onerror="this.style.display='none'">
                        <div class="info">
                            <div class="track-name">${escapeHtml(track.trackName || 'Без названия')}</div>
                            <div class="artist-name">${escapeHtml(track.artistName || 'Неизвестный')} · ${escapeHtml(track.collectionName || '')}</div>
                        </div>
                        <div class="duration">${duration}</div>
                    `;
                    item.addEventListener('click', () => selectTrack(track));
                    resultsList.appendChild(item);
                });
            }
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            function closeResults() {
                resultsDropdown.classList.remove('active');
                loadingIndicator.classList.remove('active');
                noResults.classList.remove('active');
            }
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-section')) closeResults();
            });

            // ==================== ВЫБОР ТРЕКА ====================
            function selectTrack(track) {
                state.currentTrack = track;
                closeResults();
                searchInput.value = `${track.trackName} - ${track.artistName}`;
                const coverUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100', '400x400') : '';
                if (coverUrl) {
                    npCover.src = coverUrl;
                    npCover.style.display = 'block';
                } else {
                    npCover.style.display = 'none';
                }
                npTrack.textContent = track.trackName || 'Без названия';
                npArtist.textContent = `${track.artistName || 'Неизвестный'} · ${track.collectionName || ''}`;
                npStatus.textContent = 'ТРЕК ВЫБРАН · ГОТОВ К ЗАПУСКУ';
                setStatus('ТРЕК ВЫБРАН · НАЖМИТЕ ЗАПУСК');
                playBtn.disabled = false;
                stopBtn.disabled = true;
                glitchBtn.disabled = true;
                noiseTypeBtn.disabled = true;
                if (track.previewUrl) {
                    setStatus('ПРЕВЬЮ ДОСТУПНО · 30 СЕК');
                } else {
                    setStatus('⚠ НЕТ ПРЕВЬЮ ДЛЯ ЭТОГО ТРЕКА');
                    playBtn.disabled = true;
                }
            }

            // ==================== АУДИО ДВИЖОК ====================
            function initAudioContext() {
                if (state.audioContext) return state.audioContext;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                state.audioContext = new AudioCtx();
                state.masterGain = state.audioContext.createGain();
                state.masterGain.gain.value = 0.9;
                state.masterGain.connect(state.audioContext.destination);
                state.musicGain = state.audioContext.createGain();
                state.musicGain.gain.value = musicVolumeSlider.value / 100;
                state.musicGain.connect(state.masterGain);
                state.noiseGain = state.audioContext.createGain();
                state.noiseGain.gain.value = noiseVolumeSlider.value / 100;
                state.noiseGain.connect(state.masterGain);
                state.outputAnalyser = state.audioContext.createAnalyser();
                state.outputAnalyser.fftSize = 512;
                state.outputAnalyser.smoothingTimeConstant = 0.75;
                state.musicGain.connect(state.outputAnalyser);
                state.noiseGain.connect(state.outputAnalyser);
                state.outputAnalyser.connect(state.audioContext.destination);
                return state.audioContext;
            }

            function createDistortionCurve(amount) {
                const k = amount;
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = (i * 2) / n_samples - 1;
                    curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            function createBitcrusherCurve(bits) {
                const steps = Math.pow(2, bits);
                const curve = new Float32Array(256);
                for (let i = 0; i < 256; i++) {
                    const x = (i / 255) * 2 - 1;
                    curve[i] = Math.round(x * steps) / steps;
                }
                return curve;
            }

            function createImpulseResponse(audioCtx, duration, decay) {
                const length = Math.floor(audioCtx.sampleRate * duration);
                const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
                for (let channel = 0; channel < 2; channel++) {
                    const data = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                    }
                }
                return impulse;
            }

            function createNoiseEngine(audioCtx, noiseGain) {
                const inputNode = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = parseFloat(cutoffSlider.value);
                filter.Q.value = parseFloat(resonanceSlider.value);
                const distortion = audioCtx.createWaveShaper();
                distortion.curve = createDistortionCurve(parseFloat(distortionSlider.value));
                distortion.oversample = '4x';
                const bitcrusher = audioCtx.createWaveShaper();
                bitcrusher.curve = createBitcrusherCurve(parseFloat(bitcrusherSlider.value));
                const downsampleFilter = audioCtx.createBiquadFilter();
                downsampleFilter.type = 'lowpass';
                downsampleFilter.frequency.value = parseFloat(downsampleSlider.value);
                const reverb = audioCtx.createConvolver();
                reverb.buffer = createImpulseResponse(audioCtx, 2.0, 3.0);
                const reverbGain = audioCtx.createGain();
                reverbGain.gain.value = parseFloat(reverbSlider.value);
                const dryGain = audioCtx.createGain();
                dryGain.gain.value = 1.0;

                inputNode.connect(filter);
                filter.connect(distortion);
                distortion.connect(bitcrusher);
                bitcrusher.connect(downsampleFilter);
                downsampleFilter.connect(dryGain);
                dryGain.connect(noiseGain);
                downsampleFilter.connect(reverb);
                reverb.connect(reverbGain);
                reverbGain.connect(noiseGain);

                return {
                    inputNode,
                    filter,
                    distortion,
                    bitcrusher,
                    downsampleFilter,
                    reverb,
                    reverbGain,
                    dryGain,
                    setParameters: (params) => {
                        if (params.distortion !== undefined) distortion.curve = createDistortionCurve(params.distortion);
                        if (params.bitcrusherBits !== undefined) bitcrusher.curve = createBitcrusherCurve(params.bitcrusherBits);
                        if (params.downsampleRate !== undefined) downsampleFilter.frequency.value = params.downsampleRate;
                        if (params.reverbLevel !== undefined) reverbGain.gain.value = params.reverbLevel;
                        if (params.cutoff !== undefined) filter.frequency.value = params.cutoff;
                        if (params.resonance !== undefined) filter.Q.value = params.resonance;
                    },
                    triggerBurst: (params) => {
                        const duration = params.duration || 0.2;
                        const attack = params.attack || 0.002;
                        const release = params.release || 0.08;
                        const now = audioCtx.currentTime;

                        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
                        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        const noiseSource = audioCtx.createBufferSource();
                        noiseSource.buffer = noiseBuffer;

                        const osc = audioCtx.createOscillator();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(400 + Math.random() * 2000, now);
                        osc.frequency.exponentialRampToValueAtTime(100 + Math.random() * 500, now + duration);

                        const oscGain = audioCtx.createGain();
                        oscGain.gain.setValueAtTime(0.5, now);
                        oscGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                        const gainNode = audioCtx.createGain();
                        gainNode.gain.setValueAtTime(0, now);
                        gainNode.gain.linearRampToValueAtTime(1.0, now + attack);
                        gainNode.gain.setValueAtTime(1.0, now + attack);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

                        noiseSource.connect(gainNode);
                        osc.connect(oscGain);
                        oscGain.connect(gainNode);
                        gainNode.connect(inputNode);

                        noiseSource.start(now);
                        osc.start(now);
                        noiseSource.stop(now + duration + release);
                        osc.stop(now + duration + release);
                    }
                };
            }

            function startPlayback() {
                if (!state.currentTrack || !state.currentTrack.previewUrl) return;
                const audioCtx = initAudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                stopPlayback(true);

                const source = audioCtx.createBufferSource();
                const musicAnalyser = audioCtx.createAnalyser();
                musicAnalyser.fftSize = 512;
                musicAnalyser.smoothingTimeConstant = 0.7;
                source.connect(musicAnalyser);
                musicAnalyser.connect(state.musicGain);

                const noiseEngine = createNoiseEngine(audioCtx, state.noiseGain);

                fetch(state.currentTrack.previewUrl)
                    .then(response => response.arrayBuffer())
                    .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer))
                    .then(audioBuffer => {
                        source.buffer = audioBuffer;
                        source.loop = state.loopEnabled;
                        source.start(0);

                        state.sourceNode = source;
                        state.musicAnalyser = musicAnalyser;
                        state.noiseEngine = noiseEngine;
                        state.isPlaying = true;
                        state.lastBeatTime = 0;
                        state.rhythmCounter = 0;
                        state.previousSpectrum = null;
                        state.spectralFluxHistory = [];

                        // Немедленно запускаем несколько тестовых бёрстов для демонстрации
                        setTimeout(() => {
                            if (state.isPlaying && state.noiseEngine) {
                                for (let i = 0; i < 3; i++) {
                                    setTimeout(() => {
                                        if (state.isPlaying) {
                                            state.noiseEngine.triggerBurst({
                                                duration: parseFloat(durationSlider.value),
                                                attack: parseFloat(attackSlider.value),
                                                release: parseFloat(releaseSlider.value),
                                            });
                                        }
                                    }, i * 200);
                                }
                            }
                        }, 100);

                        source.onended = () => {
                            if (state.isPlaying && !state.loopEnabled) {
                                stopPlayback(false);
                                setStatus('⏹ ПРЕВЬЮ ЗАВЕРШЕНО');
                            }
                        };

                        playBtn.disabled = true;
                        stopBtn.disabled = false;
                        glitchBtn.disabled = false;
                        noiseTypeBtn.disabled = false;
                        setStatus('▶ ИГРАЕТ · ЦИФРОВОЙ ДИСТОРШН АКТИВЕН');
                        npStatus.textContent = '▶ ИГРАЕТ';
                    })
                    .catch(err => {
                        console.error('Ошибка загрузки аудио:', err);
                        setStatus('⚠ ОШИБКА ЗАГРУЗКИ ПРЕВЬЮ');
                        cleanupAudio();
                    });
            }

            function stopPlayback(silent = false) {
                if (state.sourceNode) {
                    try { state.sourceNode.stop(); } catch (e) {}
                    state.sourceNode.disconnect();
                    state.sourceNode = null;
                }
                if (state.noiseEngine) {
                    state.noiseEngine = null;
                }
                if (state.musicAnalyser) {
                    try { state.musicAnalyser.disconnect(); } catch (e) {}
                    state.musicAnalyser = null;
                }
                state.isPlaying = false;
                state.dominantFreq = 0;
                state.frequencyHistory = [];
                state.glitchIntensity = 0;
                if (!silent) {
                    playBtn.disabled = false;
                    stopBtn.disabled = true;
                    glitchBtn.disabled = true;
                    noiseTypeBtn.disabled = true;
                    setStatus('■ ОСТАНОВЛЕНО');
                    npStatus.textContent = 'ОСТАНОВЛЕНО';
                    if (state.currentTrack) {
                        npStatus.textContent = 'ТРЕК ВЫБРАН · ГОТОВ';
                    }
                }
            }

            function cleanupAudio() {
                state.isPlaying = false;
                playBtn.disabled = false;
                stopBtn.disabled = true;
                glitchBtn.disabled = true;
                noiseTypeBtn.disabled = true;
                state.noiseEngine = null;
                state.musicAnalyser = null;
                state.sourceNode = null;
            }

            // ==================== ДЕТЕКТОР РИТМА (Спектральный поток + RMS) ====================
            function analyzeAndTrigger() {
                if (!state.isPlaying || !state.musicAnalyser || !state.noiseEngine) return;

                const analyser = state.musicAnalyser;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                // Преобразуем в нормированный массив
                const spectrum = new Float32Array(bufferLength);
                for (let i = 0; i < bufferLength; i++) {
                    spectrum[i] = dataArray[i] / 255;
                }

                // Вычисляем спектральный поток
                let flux = 0;
                if (state.previousSpectrum) {
                    for (let i = 0; i < bufferLength; i++) {
                        const diff = spectrum[i] - state.previousSpectrum[i];
                        if (diff > 0) flux += diff;
                    }
                    flux /= bufferLength;
                }
                state.previousSpectrum = spectrum.slice();

                // Вычисляем RMS низких частот (20-150 Гц)
                const sampleRate = state.audioContext.sampleRate;
                const lowStart = Math.floor(20 / (sampleRate / 2) * (bufferLength - 1));
                const lowEnd = Math.floor(150 / (sampleRate / 2) * (bufferLength - 1));
                let rms = 0;
                for (let i = lowStart; i <= lowEnd; i++) {
                    rms += dataArray[i] * dataArray[i];
                }
                rms = Math.sqrt(rms / (lowEnd - lowStart + 1)) / 255;

                // Комбинированный сигнал: максимальный из спектрального потока и RMS
                const combinedSignal = Math.max(flux, rms * 1.5);

                // Сохраняем историю для адаптивного порога
                state.spectralFluxHistory.push(combinedSignal);
                if (state.spectralFluxHistory.length > 50) state.spectralFluxHistory.shift();

                const mean = state.spectralFluxHistory.reduce((a, b) => a + b, 0) / state.spectralFluxHistory.length;
                let variance = 0;
                for (let val of state.spectralFluxHistory) {
                    variance += (val - mean) ** 2;
                }
                variance /= state.spectralFluxHistory.length;
                const std = Math.sqrt(variance);

                const userThreshold = parseFloat(thresholdSlider.value);
                const adaptiveThreshold = mean + 1.0 * std;
                const threshold = Math.max(userThreshold, adaptiveThreshold);

                const now = state.audioContext.currentTime;
                const minInterval = parseFloat(intervalSlider.value) / 1000;

                if (combinedSignal > threshold && (now - state.lastBeatTime) > minInterval) {
                    state.lastBeatTime = now;
                    state.rhythmCounter++;
                    let shouldTrigger = false;
                    switch (rhythmModeSelect.value) {
                        case 'every': shouldTrigger = true; break;
                        case 'half': shouldTrigger = (state.rhythmCounter % 2 === 0); break;
                        case 'quarter': shouldTrigger = (state.rhythmCounter % 4 === 0); break;
                        case 'random': shouldTrigger = (Math.random() < 0.7); break;
                    }
                    if (shouldTrigger) {
                        const burstParams = {
                            duration: parseFloat(durationSlider.value),
                            attack: parseFloat(attackSlider.value),
                            release: parseFloat(releaseSlider.value),
                        };
                        if (state.isGlitching) {
                            burstParams.duration *= 1 + Math.random() * 0.8;
                            burstParams.attack = Math.max(0.001, burstParams.attack * (0.5 + Math.random()));
                        }
                        state.noiseEngine.triggerBurst(burstParams);
                        // Применяем актуальные параметры эффектов
                        state.noiseEngine.setParameters({
                            distortion: parseFloat(distortionSlider.value),
                            bitcrusherBits: parseFloat(bitcrusherSlider.value),
                            downsampleRate: parseFloat(downsampleSlider.value),
                            reverbLevel: parseFloat(reverbSlider.value),
                            cutoff: parseFloat(cutoffSlider.value),
                            resonance: parseFloat(resonanceSlider.value),
                        });
                    }
                }

                // Обновляем доминирующую частоту для визуализации
                let maxValue = 0;
                let maxIndex = 0;
                const startBin = Math.floor(bufferLength * 0.02);
                const endBin = Math.floor(bufferLength * 0.6);
                for (let i = startBin; i < endBin; i++) {
                    if (dataArray[i] > maxValue) {
                        maxValue = dataArray[i];
                        maxIndex = i;
                    }
                }
                const freq = (maxIndex * sampleRate) / (analyser.fftSize);
                if (maxValue > 25 && freq > 30) {
                    state.dominantFreq = freq;
                } else {
                    state.glitchIntensity = Math.max(state.glitchIntensity - 0.02, 0.05);
                }
            }

            setInterval(analyzeAndTrigger, 30);

            // ==================== УПРАВЛЕНИЕ ====================
            playBtn.addEventListener('click', startPlayback);
            stopBtn.addEventListener('click', () => stopPlayback(false));

            glitchBtn.addEventListener('click', () => {
                if (!state.isPlaying || !state.noiseEngine) return;
                state.isGlitching = !state.isGlitching;
                if (state.isGlitching) {
                    glitchBtn.classList.add('active-btn');
                    glitchBtn.textContent = '⚡ ГЛИТЧ: ВКЛ';
                    setStatus('⚡ ГЛИТЧ-РЕЖИМ АКТИВЕН');
                } else {
                    glitchBtn.classList.remove('active-btn');
                    glitchBtn.textContent = '⚡ ГЛИТЧ';
                    setStatus('▶ ЦИФРОВОЙ ДИСТОРШН ГЕНЕРАЦИЯ');
                }
            });

            noiseTypeBtn.addEventListener('click', () => {
                state.noiseType = (state.noiseType + 1) % state.noiseTypeNames.length;
                noiseTypeBtn.textContent = `ТИП: ${state.noiseTypeNames[state.noiseType]}`;
                let newDistortion, newBitcrusher, newDownsample, newResonance, newCutoff;
                switch (state.noiseType) {
                    case 0: // ДИСТОРШН
                        newDistortion = 80; newBitcrusher = 5; newDownsample = 6000; newResonance = 4; newCutoff = 1800;
                        break;
                    case 1: // РЕЗОНАНС
                        newDistortion = 40; newBitcrusher = 4; newDownsample = 5000; newResonance = 15; newCutoff = 1000;
                        break;
                    case 2: // БИТКРАШ
                        newDistortion = 120; newBitcrusher = 3; newDownsample = 3000; newResonance = 5; newCutoff = 2500;
                        break;
                    case 3: // ХАОС
                        newDistortion = 200; newBitcrusher = 2; newDownsample = 2000; newResonance = 8; newCutoff = 4000;
                        break;
                }
                distortionSlider.value = newDistortion;
                bitcrusherSlider.value = newBitcrusher;
                downsampleSlider.value = newDownsample;
                resonanceSlider.value = newResonance;
                cutoffSlider.value = newCutoff;
                updateDisplay();
                if (state.noiseEngine) {
                    state.noiseEngine.setParameters({
                        distortion: newDistortion,
                        bitcrusherBits: newBitcrusher,
                        downsampleRate: newDownsample,
                        reverbLevel: parseFloat(reverbSlider.value),
                        cutoff: newCutoff,
                        resonance: newResonance,
                    });
                }
                setStatus(`ТИП ШУМА: ${state.noiseTypeNames[state.noiseType]}`);
            });

            // Обновление параметров в реальном времени
            [distortionSlider, bitcrusherSlider, downsampleSlider, reverbSlider, cutoffSlider, resonanceSlider].forEach(slider => {
                slider.addEventListener('input', () => {
                    if (state.noiseEngine) {
                        state.noiseEngine.setParameters({
                            distortion: parseFloat(distortionSlider.value),
                            bitcrusherBits: parseFloat(bitcrusherSlider.value),
                            downsampleRate: parseFloat(downsampleSlider.value),
                            reverbLevel: parseFloat(reverbSlider.value),
                            cutoff: parseFloat(cutoffSlider.value),
                            resonance: parseFloat(resonanceSlider.value),
                        });
                    }
                });
            });

            // Громкость
            musicVolumeSlider.addEventListener('input', () => {
                if (state.musicGain) {
                    state.musicGain.gain.value = state.musicMuted ? 0 : musicVolumeSlider.value / 100;
                }
            });
            noiseVolumeSlider.addEventListener('input', () => {
                if (state.noiseGain) {
                    state.noiseGain.gain.value = state.noiseMuted ? 0 : noiseVolumeSlider.value / 100;
                }
            });

            muteMusicBtn.addEventListener('click', () => {
                state.musicMuted = !state.musicMuted;
                muteMusicBtn.classList.toggle('active-mute', state.musicMuted);
                if (state.musicGain) {
                    state.musicGain.gain.value = state.musicMuted ? 0 : musicVolumeSlider.value / 100;
                }
                setStatus(state.musicMuted ? '🔇 МУЗЫКА ОТКЛЮЧЕНА' : '🔊 МУЗЫКА ВКЛЮЧЕНА');
            });
            muteNoiseBtn.addEventListener('click', () => {
                state.noiseMuted = !state.noiseMuted;
                muteNoiseBtn.classList.toggle('active-mute', state.noiseMuted);
                if (state.noiseGain) {
                    state.noiseGain.gain.value = state.noiseMuted ? 0 : noiseVolumeSlider.value / 100;
                }
                setStatus(state.noiseMuted ? '🔇 ШУМ ОТКЛЮЧЕН' : '🔊 ШУМ ВКЛЮЧЕН');
            });

            // Loop
            loopBtn.addEventListener('click', () => {
                state.loopEnabled = !state.loopEnabled;
                loopBtn.classList.toggle('active-btn', state.loopEnabled);
                if (state.sourceNode) {
                    state.sourceNode.loop = state.loopEnabled;
                }
                setStatus(state.loopEnabled ? '🔁 LOOP ВКЛЮЧЕН' : '🔁 LOOP ВЫКЛЮЧЕН');
            });

            // Инициализация
            noiseTypeBtn.textContent = `ТИП: ${state.noiseTypeNames[state.noiseType]}`;
            setStatus('СИСТЕМА ГОТОВА · ВВЕДИТЕ ЗАПРОС');
            window.addEventListener('load', () => {
                setTimeout(() => searchInput.focus(), 500);
            });
            window.addEventListener('beforeunload', () => {
                if (state.audioContext) state.audioContext.close();
            });
            console.log('⬡ ЦИФРОВОЙ ДИСТОРШН СИНТЕЗАТОР ЗАГРУЖЕН');
        })();
    </script>
</body>
</html>
